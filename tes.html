<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pembelajaran 1.css">
    <title>Pendaftaran Cyber Club</title>
</head>
<body>


    <div class="profile-card">
        
        <div class="form-header">
            
            <span class="badge">Junior Developer 🧐</span>
            <h2>Join Cyber Club</h2>
            <p>Daftarkan dirimu dan mulai menjadi seorang cyber security!</p>
        </div>

        <form>
            <div class="Input-Group">
                <label for="nama">Nama Lengkap</label>
            
                <input type="text" id="nama" placeholder="Muh. Zhafran Ridwan Putra" required>
            </div>

            <div class="Input-Group">
                <label for="kelas">Kelas</label>
                <input type="text" id="kelas" placeholder="XI RPL 2" required>
            </div>

            
            <div class="Input-Group">
                <label for="alasan">Ingin join komunitas?</label>
                <textarea id="alasan" rows="3" placeholder="Tulis alasan singkatmu di sini" required></textarea>
            </div>

            <button type="submit" class="btn btn-submit">Kirim Pendaftaran</button>
        </form>

    </div>

</body>
</html>
